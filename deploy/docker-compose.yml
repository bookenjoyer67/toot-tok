# TootTok LAN deployment (Alpine homelab) — dev/test profile.
# LAN-only HTTP by owner decision (no domain/cloudflare). Federation needs
# public HTTPS later — swap caddy config then; compose structure stays.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: toottok
      POSTGRES_PASSWORD: toottok
      POSTGRES_DB: toottok_dev
    volumes:
      # postgres:18 image expects the mount at the parent; it places data in
      # /var/lib/postgresql/data itself (pg_upgrade-friendly layout).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toottok"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: toottok:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://toottok:toottok@db:5432/toottok_dev
      TOOTTOK_BIND: 0.0.0.0:8080
      TOOTTOK_MEDIA_DIR: /data/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 8080 is owned by the komun.buzz nginx frontend on this box.
      - "8088:8080"
    volumes:
      - media:/data/media
      # Prebuilt frontend overrides the image copy (iterating on web changes
      # without a full image rebuild). Compose resolves ./ relative to the
      # compose file's dir — the repo root is one up from deploy/.
      - ../web/build:/usr/local/share/toottok/web:ro

volumes:
  pgdata:
  media:
